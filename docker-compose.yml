services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nbt-labs-website:latest
    container_name: nbt-labs-website
    ports:
      - "${WEB_PORT:-3010}:3000"
    environment:
      - NODE_ENV=production
    # Runtime secrets (Odoo, scorecard webhook/SMTP) are read per request by the
    # API routes, so they are passed at run time, never baked into the image
    # (`.env*` is in .dockerignore). See .env.example for the full list.
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    restart: unless-stopped
